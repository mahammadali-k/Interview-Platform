<!DOCTYPE html>
<html lang="en" data-theme="executive">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "executive-light";
        }
      } catch (e) {}
    </script>
    <title>IP - Interview Platform</title>
    <meta name="description" content="Live technical interviews with a shared code editor, video and chat." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
