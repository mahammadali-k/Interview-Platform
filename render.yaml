# Render Blueprint: one web service that serves the API and the built frontend.
# Create it from the dashboard: New + > Blueprint > pick this repository, then fill in the
# secrets marked "sync: false" (they are never stored in git).
services:
  - type: web
    name: interview-platform
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # public URL of this service, e.g. https://interview-platform.onrender.com
      - key: CLIENT_URL
        sync: false

      # backend
      - key: DB_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false

      # optional: feedback emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # frontend: read at build time by Vite
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_STREAM_API_KEY
        sync: false
      - key: VITE_API_URL
        value: /api
